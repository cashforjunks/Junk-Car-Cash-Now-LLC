<!doctype html>
<html lang="<!-- figma:lang -->">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title><!-- figma:title --></title>
    <!-- figma:head-end -->

    <!-- Security headers via meta -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Google Fonts: non-blocking preconnect + stylesheet -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap"
    />

    <!-- Preconnect for images -->
    <link rel="preconnect" href="https://images.unsplash.com" />

    <!-- Default SEO fallback (overridden per-page by useSEO) -->
    <meta name="description" content="Sell your junk car in Illinois. Free quotes, fast pickup, any condition. Cash for Junk Cars Illinois — serving Chicago and surrounding areas." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cash for Junk Cars Illinois" />
  </head>
  <body>
    <!-- figma:body-start -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- figma:body-end -->
  </body>
</html>
